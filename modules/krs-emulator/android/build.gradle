plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.krsemulator'
version = '0.1.0'

// Build the same ABIs as the app so no installable device is missing the core.
def nativeAbis = (findProperty('reactNativeArchitectures') ?: 'arm64-v8a,x86_64')
  .toString()
  .split(',')
  .collect { it.trim() }

android {
  namespace 'expo.modules.krsemulator'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'

    ndk {
      abiFilters(*nativeAbis)
    }

    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        cppFlags '-std=c++17'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
      version '3.22.1'
    }
  }

  buildFeatures {
    prefab true
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.google.oboe:oboe:1.11.0'
}
